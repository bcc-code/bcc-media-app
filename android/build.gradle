buildscript {
    ext.kotlin_version = '2.2.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        // START: FlutterFire Configuration
        classpath 'com.google.gms:google-services:4.3.14'
        classpath 'com.google.firebase:perf-plugin:1.4.1'
        // END: FlutterFire Configuration
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Align JVM targets for plugin subprojects. Some plugins (e.g. rudder_plugin_android)
// only set Java's targetCompatibility but leave Kotlin's default to the toolchain JVM,
// which trips Kotlin 2.x's strict JVM target validation on CI (Java 17).
// Must be registered before evaluationDependsOn below.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }
            }
            // Some plugins still declare an old compileSdk (flutter_appauth 7.x is on 31).
            // AGP 8.13 fails the build when a transitive androidx artifact requires a higher
            // one, so pull plugin subprojects up to the app's compileSdk. Can be removed once
            // every plugin compiles against 34+ (flutter_appauth >=10 does).
            if (project.name != 'app') {
                project.android.compileSdk 36
            }
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '11'
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register('clean', Delete) {
    delete rootProject.buildDir
}
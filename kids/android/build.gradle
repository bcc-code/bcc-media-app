buildscript {
    ext.kotlin_version = '2.2.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Align JVM targets for plugin subprojects. Some plugins (e.g. rudder_plugin_android)
// only set Java's targetCompatibility but leave Kotlin's default to the toolchain JVM,
// which trips Kotlin 2.x's strict JVM target validation on CI (Java 17).
// Must be registered before evaluationDependsOn below.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_11
                    targetCompatibility JavaVersion.VERSION_11
                }
            }
            // soundpool (the hohoins fork, kids-only) still compiles against android-31,
            // and AGP fails the build when a transitive androidx artifact requires 34+.
            // Narrowed from the old blanket clamp on every plugin, which existed for
            // flutter_appauth 7.x and would otherwise hold plugins below the compileSdk
            // they now need (flutter_secure_storage 11 wants 37). Remove once soundpool
            // is forked forward or replaced.
            if (project.name == 'soundpool') {
                project.android.compileSdk 36
            }
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = '11'
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
